name: Build public runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-runtime-check
  cancel-in-progress: false
jobs:
  simulator:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [field, customer]
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Check and generate
        run: |
          npm ci
          node ../scripts/check.mjs
          python3 -m unittest discover -s ../scripts -p test_ios_signing.py
          npm run export:ios
          npm run native:ios
          cd ios
          pod install
      - name: Compile simulator runtime without signing
        run: |
          projects=(ios/*.xcodeproj)
          test "${#projects[@]}" -eq 1
          scheme="$(basename "${projects[0]}" .xcodeproj)"
          xcodebuild -workspace "ios/$scheme.xcworkspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/client-build" CODE_SIGNING_ALLOWED=NO build
