name: Signed development client

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Native runtime
        type: choice
        options: [field, customer]
        default: field

permissions:
  contents: read

concurrency:
  group: signed-${{ inputs.runtime }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    environment: ${{ inputs.runtime }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CONFIGURATION: Debug
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      CLIENT_SCHEME: ${{ vars.CLIENT_SCHEME }}
      APPLE_MERCHANT_ID: ${{ vars.APPLE_MERCHANT_ID }}
      ASSOCIATED_DOMAIN: ${{ vars.ASSOCIATED_DOMAIN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check required signing secrets
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_BUNDLE_ID" && test "${#ARTIFACT_PASSWORD}" -ge 32 && test -n "$CERTIFICATE" && test -n "$PASSWORD" && test -n "$PROFILE" || {
            echo "::error::Configure the signing settings and artifact password described in README.md."
            exit 1
          }
          case "$CONFIGURATION" in Debug|Release) ;; *) exit 1 ;; esac
          xcodebuild -version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install and check source
        run: |
          npm ci
          node ../scripts/check.mjs
          python3 -m unittest discover -s ../scripts -p test_ios_signing.py
      - name: Generate native iOS project
        run: |
          npm run native:ios
          cd ios
          pod install
      - name: Install signing identity in temporary keychain
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing.mobileprovision"
          keychain="$RUNNER_TEMP/iphone-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/^[[:space:]]*[0-9]+\) ([A-F0-9]{40}) .*/\1/p')"
          security cms -D -i "$RUNNER_TEMP/signing.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          bundle_id="$IOS_BUNDLE_ID"
          PROFILE_UUID="$(python3 ../scripts/prepare_ios_signing.py "$RUNNER_TEMP/profile.plist" "$bundle_id" "$identity" "$RUNNER_TEMP")"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive and export signed iPhone app
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          projects=(ios/*.xcodeproj)
          test "${#projects[@]}" -eq 1
          project="${projects[0]}"
          scheme="$(basename "$project" .xcodeproj)"
          fastlane run update_code_signing_settings \
            path:"$project" use_automatic_signing:false \
            team_id:"$APPLE_TEAM_ID" code_sign_identity:"$SIGNING_CERTIFICATE" \
            profile_name:"$PROFILE_UUID"
          xcodebuild -workspace "ios/$scheme.xcworkspace" -scheme "$scheme" \
            -configuration "$CONFIGURATION" -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenClient.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OpenClient.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/iphone-export"
          ipas=("$RUNNER_TEMP"/iphone-export/*.ipa)
          test "${#ipas[@]}" -eq 1 && test -f "${ipas[0]}"
          node ../scripts/seal.mjs seal "${ipas[0]}" "$RUNNER_TEMP/client.sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-${{ inputs.runtime }}-${{ github.sha }}
          path: ${{ runner.temp }}/client.sealed
          if-no-files-found: error
          retention-days: 1
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/iphone-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
